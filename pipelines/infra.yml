trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.8'
  workingDirectory: 'infrastructure/terraform/environments/dev'
  azureServiceConnection: 'sc-techrescue-dev'

stages:

# ============================================================
# STAGE 1 - VALIDATE
# ============================================================

- stage: Validate
  displayName: "Terraform Validate"

  jobs:
  - job: TerraformValidate

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)
        inlineScript: |

          terraform init \
            -input=false

    - script: |
        terraform fmt -check -recursive
      displayName: "Terraform Format Check"
      workingDirectory: $(workingDirectory)

    - script: |
        terraform validate
      displayName: "Terraform Validate"
      workingDirectory: $(workingDirectory)


# ============================================================
# STAGE 2 - PLAN
# ============================================================

- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Validate
  condition: succeeded()

  jobs:

  - job: TerraformPlan

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(workingDirectory)

        inlineScript: |

          terraform init -input=false

          terraform plan \
            -input=false \
            -out=tfplan

    - publish: $(workingDirectory)/tfplan
      artifact: terraform-plan


# ============================================================
# STAGE 3 - APPLY
# ============================================================

- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()

  jobs:

  - deployment: TerraformApply
    displayName: "Apply Infrastructure"

    environment: "techrescue-dev"

    strategy:
      runOnce:

        deploy:

          steps:

          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: "Terraform Apply"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)

              inlineScript: |

                terraform init -input=false

                terraform apply \
                  -input=false \
                  -auto-approve