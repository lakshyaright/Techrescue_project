# ==============================================================================
# NGINX CONFIGURATION FOR TECHRESCUE FRONTEND VM
# File: /etc/nginx/sites-available/techrescue-frontend
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Replace with your custom domain or Azure Application Gateway internal CNAME
    server_name _;

    root /var/www/techrescue/frontend/dist;
    index index.html index.htm;

    # Gzip Compression for high-density SaaS asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Proxy pass: Route /api requests directly to Backend VM private IP
    # (Used when traffic hits Frontend VM directly or as an alternative to App Gateway path routing)
    location /api/ {
        # Update 10.0.2.4 with your Backend VM internal private IP
        proxy_pass http://10.0.2.4:5000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health Probe endpoint for Azure Application Gateway
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Single Page Application (SPA) HTML5 History fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
